name: Build Debian Package

on:
  push:
  workflow_dispatch:

jobs:
  # define the releases here. These will be used in all CI jobs
  define-releases:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.releases.outputs.releases }}
    steps:
      - id: releases
        run: |
          releases=(
            bookworm
            trixie
          )

          printf 'releases=%s\n' \
            "$(printf '%s\n' "${releases[@]}" | jq -R . | jq -s -c .)" \
            >> "$GITHUB_OUTPUT"

  # Build var-mii in a Debian container for every push or manual run
  build:
    needs: define-releases
    runs-on: linux-arm64
    container:
      image: debian:${{ matrix.deb_dist }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        deb_dist: ${{ fromJSON(needs.define-releases.outputs.releases) }}
        deb_arch:
          - arm64
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            build-essential \
            make \
            gcc \
            binutils \
            devscripts \
            debhelper \
            fakeroot \
            lintian \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      - name: Generate changelog entry
        run: scripts/gen-deb-changelog.sh "${{ matrix.deb_dist }}"

      - name: Build Debian package
        run: |
          DEB_BUILD_OPTIONS="parallel=$(nproc)" \
            dpkg-buildpackage -us -uc -b -aarm64

      - name: Collect build artifacts
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_DIR=build-artifacts
          mkdir -p "${ARTIFACT_DIR}"
          shopt -s nullglob
          files=(../*.deb ../*.buildinfo ../*.changes)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No build artifacts produced." >&2
            exit 1
          fi
          mv "${files[@]}" "${ARTIFACT_DIR}/"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: var-mii-${{ github.sha }}-${{ matrix.deb_dist }}-${{ matrix.deb_arch }}
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 1

  # Publish the newly built package to var-debpkgs after master pushes or manual runs
  publish:
    needs:
      - build
      - define-releases
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    env:
      TARGET_REPO: varigit-dev/var-debpkgs
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: var-mii-${{ github.sha }}-*
          merge-multiple: false

      - name: Debug downloaded artifacts
        run: |
          echo "Contents of ./dist after download:"
          if ! ls -R dist; then
            echo "dist directory missing!" >&2
            exit 1
          fi

      - name: Install repository tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils git jq

      - name: Checkout var-debpkgs
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.VARISCITE_BOT_TOKEN }}
          path: var-debpkgs
          ref: master

      - name: Copy packages into repo
        id: copy_pkgs
        shell: bash
        working-directory: var-debpkgs
        run: |
          set -euo pipefail
          shopt -s nullglob

          pkg_version=""

          copy_package()
          {
            local deb_dist="$1"
            local deb_arch="$2"

            local artifact_dir="../dist/var-mii-${{ github.sha }}-${deb_dist}-${deb_arch}"

            local debs=(
              "${artifact_dir}"/var-mii_*.deb
            )

            if [[ ${#debs[@]} -ne 1 ]]; then
              echo "Expected exactly one var-mii_*.deb artifact for ${deb_dist}/${deb_arch}, found ${#debs[@]}." >&2
              printf '  %s\n' "${debs[@]:-<none>}"
              exit 1
            fi

            local deb_file="${debs[0]}"
            local target_dir="var/pool/${deb_dist}"

            mkdir -p "${target_dir}"

            local version
            version="$(dpkg-deb --field "${deb_file}" Version)"

            cp "${deb_file}" "${target_dir}/"

            echo "Copied ${deb_file} (version ${version}) -> ${target_dir}"
            if [[ -n "${pkg_version}" && "${pkg_version}" != "${version}" ]]; then
              echo "Package version mismatch ${pkg_version} != ${version}" >&2
              exit 1
            fi
            pkg_version=$version
          }

          mapfile -t releases < <(
            jq -r '.[]' <<< '${{ needs.define-releases.outputs.releases }}'
          )

          for release in "${releases[@]}"; do
            copy_package "${release}" arm64
          done
          echo "version=${pkg_version}" >> "${GITHUB_OUTPUT}"

      - name: Update PPA metadata
        working-directory: var-debpkgs
        run: |
          ./update-ppa.sh

      - name: Commit and push changes
        id: commit_push
        shell: bash
        working-directory: var-debpkgs
        run: |
          set -euo pipefail
          git config user.name "Var Bot"
          git config user.email "varibot@variscite.com"

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes after update-ppa.sh; skipping PR."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          BRANCH_NAME="ci/var-mii-${{ github.run_id }}-${{ github.run_attempt }}"
          git switch -c "${BRANCH_NAME}"
          git add .
          git commit -m "var-mii: update packages"
          git push -u origin "${BRANCH_NAME}"
          echo "branch=${BRANCH_NAME}" >> "${GITHUB_OUTPUT}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Open pull request
        if: steps.commit_push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.VARISCITE_BOT_TOKEN }}
        run: |
          gh pr create \
            --repo "${{ env.TARGET_REPO }}" \
            --head "${{ steps.commit_push.outputs.branch }}" \
            --base master \
            --title "var-mii package update to ${{ steps.copy_pkgs.outputs.version }}" \
            --body "Automated package update triggered by var-mii commit ${{ github.sha }}." \
            --label "sync-to-varigit"
